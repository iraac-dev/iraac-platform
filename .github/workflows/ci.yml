name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Diff whitespace
        run: git diff --check HEAD^ HEAD
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable local database
        run: supabase start --ignore-health-check
      - name: Reset and apply every migration
        run: supabase db reset
      - name: Database lint
        run: supabase db lint --level error
      - name: pgTAP authorization and consent suites
        run: supabase test db
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: |
          if grep -rInE "(api[_-]?key|secret|token|password)\s*[:=]\s*['\"][A-Za-z0-9_\-]{12,}" --include="*.ts" --include="*.js" --include="*.json" --include="*.md" --include="*.env*" . | grep -v node_modules | grep -v ".example"; then
            echo "Possible secret found in source files"
            exit 1
          fi
          echo "No obvious secrets found"
